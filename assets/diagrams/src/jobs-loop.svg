<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5F66"/>
    </marker>
    <symbol id="phone" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="#CFE7D7"/>
      <circle cx="14" cy="41.5" r="2" fill="#3C8D5A"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="750" rx="24" fill="#FAFAF7"/>

  <text x="40" y="58" font-size="26" font-weight="700" fill="#1E2328">Super Borg jobs</text>
  <text x="40" y="84" font-size="15" fill="#5B5F66">Long work in many small, stateless steps; the job's state lives on the controller, not in a chat</text>

  <!-- entry points -->
  <rect x="40" y="130" width="220" height="230" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="60" y="162" font-size="17" font-weight="700" fill="#4A3F66">Start a job</text>
  <g font-size="14" fill="#4A3F66">
    <text x="60" y="194">pbctl jobs new</text>
    <text x="60" y="224">start_job tool in a</text>
    <text x="60" y="244">Super Borg chat</text>
    <text x="60" y="274">MCP job_start</text>
    <text x="60" y="294">(pbctl mcp)</text>
  </g>
  <text x="60" y="324" font-size="13.5" fill="#5E4F85">pool=…, else the first</text>
  <text x="60" y="342" font-size="13.5" fill="#5E4F85">Super Borg pool</text>

  <line x1="260" y1="245" x2="297" y2="245" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- queue -->
  <rect x="300" y="130" width="200" height="230" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text x="320" y="162" font-size="17" font-weight="700" fill="#1F3F5E">job queue</text>
  <g font-size="14" fill="#1F3F5E">
    <text x="320" y="194">one job at a time</text>
    <text x="320" y="216">oldest first</text>
    <text x="320" y="248">state on disk:</text>
    <text x="320" y="270">one JSON file per job</text>
    <text x="320" y="292">(tasks, docs, events)</text>
  </g>
  <text x="320" y="324" font-size="13.5" fill="#5B5F66">after a restart it</text>
  <text x="320" y="342" font-size="13.5" fill="#5B5F66">continues where it was</text>


  <!-- leaving the loop -->
  <rect x="40" y="400" width="460" height="220" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text x="60" y="432" font-size="17" font-weight="700" fill="#1F3F5E">The job leaves the loop when</text>
  <g font-size="14" fill="#1F3F5E">
    <text x="60" y="464">ask_user → waiting for an answer</text>
    <text x="60" y="492">finish, called the second time → done</text>
    <text x="60" y="520">80 steps in one run → waiting ("continue")</text>
  </g>
  <text x="60" y="548" font-size="14" fill="#8A2F25">5 failed steps in a row → failed</text>
  <text x="60" y="590" font-size="13.5" fill="#5B5F66">a user message puts a waiting or failed job</text>
  <text x="60" y="608" font-size="13.5" fill="#5B5F66">back in the queue</text>

  <!-- step loop container -->
  <rect x="540" y="110" width="620" height="360" rx="18" fill="#EEF3F8" stroke="#2F5D8A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="560" y="137" font-size="14" font-weight="600" fill="#2F5D8A">STEP LOOP · on the controller · one tool call per step</text>

  <g font-size="14" fill="#1F3F5E">
    <rect x="565" y="155" width="270" height="115" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
    <text x="583" y="183" font-size="16" font-weight="700">1 · compact job view</text>
    <text x="583" y="207">goal · task list</text>
    <text x="583" y="229">document previews</text>
    <text x="583" y="251">last 6 steps</text>

    <rect x="865" y="155" width="270" height="115" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
    <text x="883" y="183" font-size="16" font-weight="700">2 · orchestrator</text>
    <text x="883" y="207">one stateless call</text>
    <text x="883" y="229">tool_choice: required</text>
    <text x="883" y="251">→ exactly one tool call</text>

    <rect x="865" y="305" width="270" height="145" rx="12" fill="#DCE7F2" stroke="#2F5D8A" stroke-width="2"/>
    <text x="883" y="333" font-size="16" font-weight="700">3 · one tool</text>
    <text x="883" y="357">plan_tasks · delegate</text>
    <text x="883" y="379">write_doc · read_doc</text>
    <text x="883" y="401">ask_user · finish</text>
    <text x="883" y="429" font-size="13.5" fill="#2F5D8A">finish must be called twice</text>

    <rect x="565" y="305" width="270" height="145" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
    <text x="583" y="333" font-size="16" font-weight="700">4 · documents</text>
    <text x="583" y="357">worker results and</text>
    <text x="583" y="379">write_doc texts, by name</text>
    <text x="583" y="407" font-size="13.5" fill="#2F5D8A">only a 160-byte preview</text>
    <text x="583" y="427" font-size="13.5" fill="#2F5D8A">goes back to the orchestrator</text>
  </g>

  <line x1="835" y1="212" x2="862" y2="212" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="270" x2="1000" y2="302" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="378" x2="838" y2="378" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="305" x2="700" y2="273" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="714" y="294" font-size="14" font-weight="700" fill="#1E2328">next step</text>

  <line x1="500" y1="212" x2="562" y2="212" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="203" font-size="13.5" fill="#5B5F66" text-anchor="middle">run</text>

  <!-- delegate fan-out -->
  <path d="M1000,450 V510" fill="none" stroke="#5B5F66" stroke-width="2.5"/>
  <line x1="700" y1="510" x2="1060" y2="510" stroke="#5B5F66" stroke-width="2.5"/>
  <line x1="700" y1="510" x2="700" y2="537" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="510" x2="880" y2="537" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1060" y1="510" x2="1060" y2="537" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="988" y="499" font-size="14" font-weight="700" fill="#1E2328" text-anchor="end">delegate · tasks run in parallel</text>

  <path d="M620,590 H585 V453" fill="none" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="597" y="499" font-size="13.5" fill="#2E6E46">results</text>

  <!-- worker phones -->
  <g font-size="14" fill="#24563A">
    <rect x="620" y="540" width="160" height="100" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="634" y="556" width="28" height="48"/>
    <text x="672" y="578" font-size="16" font-weight="700">worker 1</text>
    <text x="672" y="600">≥ 1.5B model</text>
    <text x="634" y="626" font-size="13.5" fill="#2E6E46">max_tokens 1200</text>

    <rect x="800" y="540" width="160" height="100" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="814" y="556" width="28" height="48"/>
    <text x="852" y="578" font-size="16" font-weight="700">worker 2</text>
    <text x="852" y="600">≥ 1.5B model</text>
    <text x="814" y="626" font-size="13.5" fill="#2E6E46">max_tokens 1200</text>

    <rect x="980" y="540" width="160" height="100" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="994" y="556" width="28" height="48"/>
    <text x="1032" y="578" font-size="16" font-weight="700">worker N</text>
    <text x="1032" y="600">≥ 1.5B model</text>
    <text x="994" y="626" font-size="13.5" fill="#2E6E46">max_tokens 1200</text>
  </g>
  <text x="620" y="668" font-size="13.5" fill="#5B5F66">the gateway, not the orchestrator, picks the fastest free worker for each task</text>

  <!-- legend -->
  <g font-size="13.5" fill="#5B5F66">
    <rect x="40" y="708" width="14" height="14" rx="3" fill="#7A6A9E"/><text x="62" y="720">entry points</text>
    <rect x="160" y="708" width="14" height="14" rx="3" fill="#2F5D8A"/><text x="182" y="720">controller</text>
    <rect x="266" y="708" width="14" height="14" rx="3" fill="#3C8D5A"/><text x="288" y="720">worker phones</text>
  </g>
</svg>
