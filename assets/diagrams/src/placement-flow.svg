<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5F66"/>
    </marker>
    <symbol id="phone" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="#CFE7D7"/>
      <circle cx="14" cy="41.5" r="2" fill="#3C8D5A"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="24" fill="#FAFAF7"/>

  <text x="40" y="58" font-size="26" font-weight="700" fill="#1E2328">How a model reaches a phone</text>
  <text x="40" y="84" font-size="15" fill="#5B5F66">The operator adds a model to the catalog; the planner decides where it runs; the phone pulls it</text>

  <!-- catalog add -->
  <rect x="40" y="130" width="260" height="170" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="60" y="162" font-size="17" font-weight="700" fill="#4A3F66">catalog add</text>
  <g font-size="14" fill="#4A3F66">
    <text x="60" y="194">https://…/file.gguf</text>
    <text x="60" y="218">hf://owner/repo/file.gguf</text>
    <text x="60" y="242">file:///abs/path.gguf</text>
  </g>
  <text x="60" y="278" font-size="13.5" fill="#5E4F85">pbctl or the panel</text>

  <line x1="300" y1="215" x2="337" y2="215" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- download -->
  <rect x="340" y="130" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text x="360" y="162" font-size="17" font-weight="700" fill="#1F3F5E">controller</text>
  <g font-size="14" fill="#1F3F5E">
    <text x="360" y="194">downloads the GGUF</text>
    <text x="360" y="218">computes SHA-256</text>
  </g>
  <rect x="360" y="236" width="200" height="44" rx="10" fill="#DCE7F2"/>
  <text x="376" y="264" font-size="14" font-weight="700" fill="#1F3F5E">status: ready</text>

  <line x1="580" y1="215" x2="617" y2="215" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- planner -->
  <rect x="620" y="130" width="540" height="345" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2.5"/>
  <text x="640" y="162" font-size="18" font-weight="700" fill="#1F3F5E">planner</text>
  <text x="720" y="162" font-size="14" fill="#5B5F66">every 10 s and on every change</text>

  <g font-size="14" fill="#1F3F5E">
    <rect x="640" y="178" width="240" height="250" rx="10" fill="#DCE7F2"/>
    <text x="656" y="204" font-size="16" font-weight="700">rules, in order</text>
    <text x="656" y="234">1  pin</text>
    <text x="656" y="262">2  replicas</text>
    <text x="656" y="290">3  percent</text>
    <text x="676" y="310" font-size="13.5" fill="#2F5D8A">bigger models pick first</text>
    <text x="656" y="338">4  default_model</text>
    <text x="656" y="366">5  keep</text>
    <text x="676" y="386" font-size="13.5" fill="#2F5D8A">what the node serves</text>

    <rect x="900" y="178" width="240" height="250" rx="10" fill="#DCE7F2"/>
    <text x="916" y="204" font-size="16" font-weight="700">a node qualifies if</text>
    <text x="916" y="234">not drained</text>
    <text x="916" y="262">its class matches</text>
    <text x="936" y="282" font-size="13.5" fill="#2F5D8A">the policy's class filter</text>
    <text x="916" y="310">the model fits memory</text>
    <text x="916" y="338">≥ 3 tok/s predicted</text>
    <text x="936" y="358" font-size="13.5" fill="#2F5D8A">unmeasured: never excluded</text>
    <text x="916" y="394" font-size="13.5" fill="#5B5F66">drained nodes still</text>
    <text x="916" y="412" font-size="13.5" fill="#5B5F66">follow pins</text>
  </g>
  <text x="640" y="456" font-size="13.5" fill="#5B5F66">class by RAM: xs &lt; 3 GiB · s 3–5 · m 5–7 · l 7–10 · xl 10+</text>

  <line x1="1030" y1="475" x2="1030" y2="512" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- assignment -->
  <rect x="880" y="515" width="280" height="175" rx="14" fill="#DCE7F2" stroke="#2F5D8A" stroke-width="2"/>
  <text x="900" y="547" font-size="17" font-weight="700" fill="#1F3F5E">assignment</text>
  <g font-size="14" fill="#1F3F5E">
    <text x="900" y="577">one model per phone</text>
    <text x="900" y="609">sent as Desired in the</text>
    <text x="900" y="631">reply to each heartbeat</text>
  </g>
  <text x="900" y="667" font-size="13.5" fill="#2F5D8A">model id · URL · SHA-256 · size</text>

  <line x1="880" y1="602" x2="793" y2="602" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="836" y="591" font-size="13.5" font-weight="600" fill="#5B5F66" text-anchor="middle">every 5 s</text>

  <!-- phone -->
  <rect x="40" y="515" width="750" height="175" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <use href="#phone" x="58" y="527" width="20" height="34"/>
  <text x="88" y="550" font-size="17" font-weight="700" fill="#24563A">node-agent on the phone</text>

  <g font-size="14" fill="#24563A">
    <rect x="60" y="572" width="205" height="90" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="1.5"/>
    <text x="76" y="598" font-weight="700">download</text>
    <text x="76" y="620">/v1/model-files/{id}</text>
    <text x="76" y="642" font-size="13.5" fill="#2E6E46">Range resume · SHA check</text>

    <rect x="290" y="572" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="1.5"/>
    <text x="306" y="598" font-weight="700">load</text>
    <text x="306" y="620">size memory,</text>
    <text x="306" y="642">start llama-server</text>

    <rect x="465" y="572" width="140" height="90" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="1.5"/>
    <text x="481" y="598" font-weight="700">self-test</text>
    <text x="481" y="620">32 tokens</text>
    <text x="481" y="642">→ tok/s</text>

    <rect x="630" y="572" width="140" height="90" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="1.5"/>
    <text x="646" y="598" font-weight="700">serving</text>
    <text x="646" y="620">ready for</text>
    <text x="646" y="642">requests</text>
  </g>
  <line x1="265" y1="617" x2="287" y2="617" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="617" x2="462" y2="617" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="617" x2="627" y2="617" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="40" y="716" font-size="13.5" fill="#8A2F25">a failed load falls back to the previous model; retries back off 30 s … 10 min</text>

  <!-- legend -->
  <g font-size="13.5" fill="#5B5F66">
    <rect x="40" y="732" width="14" height="14" rx="3" fill="#7A6A9E"/><text x="62" y="744">operator</text>
    <rect x="140" y="732" width="14" height="14" rx="3" fill="#2F5D8A"/><text x="162" y="744">controller</text>
    <rect x="248" y="732" width="14" height="14" rx="3" fill="#3C8D5A"/><text x="270" y="744">phone</text>
  </g>
</svg>
