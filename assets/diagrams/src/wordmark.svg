<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#CFE7D7"/>
      <path d="M6,0 V6 M0,6 H6" stroke="#3C8D5A" stroke-width="0.9" opacity="0.7"/>
    </pattern>
    <!-- assimilated phone: screen carries the collective's grid -->
    <symbol id="phone" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="url(#grid)"/>
      <circle cx="14" cy="41.5" r="2" fill="#3C8D5A"/>
    </symbol>
    <!-- phone being assimilated: grey shell, grid creeping up the screen -->
    <symbol id="phone-new" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#8A9097" stroke-width="2.5" stroke-dasharray="4 2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="#E6E8EB"/>
      <rect x="5" y="22" width="18" height="15" rx="1.5" fill="url(#grid)"/>
      <circle cx="14" cy="41.5" r="2" fill="#8A9097"/>
    </symbol>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="300" rx="24" fill="#FAFAF7"/>

  <!-- wordmark -->
  <text x="64" y="146" font-size="84" font-weight="800" fill="#1E2328" letter-spacing="-2">Phone<tspan fill="#2F5D8A">Borg</tspan></text>
  <text x="68" y="190" font-size="18" fill="#5B5F66">Old Android phones → one AI inference cluster</text>
  <text x="68" y="224" font-size="16" font-style="italic" font-weight="600" fill="#2E6E46">Resistance is futile. Your Android will be assimilated.</text>

  <!-- phones -->
  <use href="#phone" x="600" y="96" width="42" height="72"/>
  <use href="#phone" x="676" y="96" width="42" height="72"/>
  <use href="#phone" x="752" y="96" width="42" height="72"/>
  <use href="#phone" x="828" y="96" width="42" height="72"/>
  <use href="#phone-new" x="904" y="96" width="42" height="72"/>
  <text x="925" y="84" font-size="13.5" font-style="italic" fill="#2E6E46" text-anchor="middle">assimilating…</text>

  <!-- USB bus -->
  <g stroke="#3C8D5A" stroke-width="4" stroke-linecap="round">
    <line x1="621" y1="170" x2="621" y2="206"/>
    <line x1="697" y1="170" x2="697" y2="206"/>
    <line x1="773" y1="170" x2="773" y2="206"/>
    <line x1="849" y1="170" x2="849" y2="206"/>
    <line x1="621" y1="206" x2="992" y2="206"/>
  </g>
  <line x1="925" y1="170" x2="925" y2="206" stroke="#3C8D5A" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="620" y="236" font-size="13.5" fill="#2E6E46">4 of 5 assimilated</text>
  <text x="958" y="196" font-size="14" font-weight="700" fill="#2E6E46" text-anchor="middle">USB</text>

  <!-- the collective: the host as a cube -->
  <g stroke="#2F5D8A" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="996,160 1024,132 1164,132 1136,160" fill="#C9D9EA"/>
    <polygon points="1136,160 1164,132 1164,222 1136,250" fill="#B7CCE2"/>
    <rect x="996" y="160" width="140" height="90" fill="#DCE7F2"/>
  </g>
  <g stroke="#2F5D8A" stroke-width="1" opacity="0.55">
    <line x1="1031" y1="160" x2="1059" y2="132"/>
    <line x1="1066" y1="160" x2="1094" y2="132"/>
    <line x1="1101" y1="160" x2="1129" y2="132"/>
    <line x1="1010" y1="146" x2="1150" y2="146"/>
    <line x1="1150" y1="146" x2="1150" y2="236"/>
    <line x1="1136" y1="190" x2="1164" y2="162"/>
    <line x1="1136" y1="220" x2="1164" y2="192"/>
  </g>
  <text x="1066" y="200" font-size="16" font-weight="700" fill="#1F3F5E" text-anchor="middle">the collective</text>
  <text x="1066" y="225" font-size="14" fill="#1F3F5E" text-anchor="middle">host · one endpoint</text>
</svg>
