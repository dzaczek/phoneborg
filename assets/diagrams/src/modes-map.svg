<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5F66"/>
    </marker>
    <symbol id="phone" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="#CFE7D7"/>
      <circle cx="14" cy="41.5" r="2" fill="#3C8D5A"/>
    </symbol>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="860" rx="24" fill="#FAFAF7"/>

  <!-- title -->
  <text x="40" y="58" font-size="26" font-weight="700" fill="#1E2328">Cluster modes</text>
  <text x="40" y="84" font-size="15" fill="#5B5F66">One fleet, one endpoint: the request's model selector picks how the phones work on it</text>

  <!-- clients -->
  <rect x="40" y="108" width="560" height="92" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="60" y="138" font-size="17" font-weight="700" fill="#4A3F66">API clients</text>
  <text x="60" y="162" font-size="14" fill="#4A3F66">OpenAI SDK · curl · opencode · Ollama apps</text>
  <text x="60" y="184" font-size="13.5" fill="#5E4F85">send any selector below as "model"</text>

  <rect x="616" y="108" width="266" height="92" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="634" y="138" font-size="17" font-weight="700" fill="#4A3F66">Agent + MCP</text>
  <text x="634" y="162" font-size="14" fill="#4A3F66">pbctl mcp · cluster_map ≤ 32</text>
  <text x="634" y="184" font-size="13.5" fill="#5E4F85">fans out normal requests (pools)</text>

  <rect x="898" y="108" width="262" height="92" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="916" y="138" font-size="17" font-weight="700" fill="#4A3F66">Jobs</text>
  <text x="916" y="162" font-size="14" fill="#4A3F66">pbctl jobs new · job_start</text>
  <text x="916" y="184" font-size="13.5" fill="#5E4F85">runs on a Super Borg pool</text>

  <line x1="320" y1="200" x2="320" y2="226" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="749" y1="200" x2="749" y2="226" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1029" y1="200" x2="1029" y2="226" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- gateway -->
  <rect x="40" y="228" width="1120" height="62" rx="14" fill="#DCE7F2" stroke="#2F5D8A" stroke-width="2.5"/>
  <text x="60" y="265" font-size="17" font-weight="700" fill="#1F3F5E">gateway</text>
  <text x="145" y="265" font-size="14" fill="#1F3F5E">auth → resolve the model selector → pick phones → forward &amp; stream</text>

  <!-- gateway to lanes -->
  <g stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="148" y1="290" x2="148" y2="318"/>
    <line x1="374" y1="290" x2="374" y2="318"/>
    <line x1="600" y1="290" x2="600" y2="318"/>
    <line x1="826" y1="290" x2="826" y2="318"/>
    <line x1="1052" y1="290" x2="1052" y2="318"/>
  </g>

  <!-- lane frames -->
  <g fill="#FFFFFF" stroke="#5B5F66" stroke-width="1.5">
    <rect x="40" y="320" width="216" height="372" rx="14"/>
    <rect x="266" y="320" width="216" height="372" rx="14"/>
    <rect x="492" y="320" width="216" height="372" rx="14"/>
    <rect x="718" y="320" width="216" height="372" rx="14"/>
    <rect x="944" y="320" width="216" height="372" rx="14"/>
  </g>
  <g stroke="#D5D8DC" stroke-width="1.5">
    <line x1="54" y1="610" x2="242" y2="610"/>
    <line x1="280" y1="610" x2="468" y2="610"/>
    <line x1="506" y1="610" x2="694" y2="610"/>
    <line x1="732" y1="610" x2="920" y2="610"/>
    <line x1="958" y1="610" x2="1146" y2="610"/>
  </g>

  <!-- lane 1: one phone -->
  <text x="56" y="352" font-size="17" font-weight="700" fill="#1E2328">One phone</text>
  <text x="56" y="378" font-size="14" font-weight="600" fill="#5E4F85">model id · auto</text>
  <text x="56" y="398" font-size="14" font-weight="600" fill="#5E4F85">node/&lt;alias&gt;</text>
  <rect x="56" y="420" width="184" height="104" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <use href="#phone" x="72" y="436" width="34" height="58"/>
  <text x="118" y="456" font-size="16" font-weight="700" fill="#24563A">phone</text>
  <text x="118" y="478" font-size="14" fill="#24563A">its own model</text>
  <text x="118" y="498" font-size="14" fill="#24563A">whole request</text>
  <text x="56" y="552" font-size="14" fill="#5B5F66">affinity picker</text>
  <text x="56" y="574" font-size="14" fill="#5B5F66">retry once on another</text>
  <text x="56" y="594" font-size="14" fill="#5B5F66">phone on failure</text>
  <text x="56" y="636" font-size="13.5" font-weight="700" fill="#1E2328">best for</text>
  <text x="56" y="658" font-size="14" fill="#5B5F66">chat and coding with a</text>
  <text x="56" y="678" font-size="14" fill="#5B5F66">model that fits one phone</text>

  <!-- lane 2: semantic router -->
  <text x="282" y="352" font-size="17" font-weight="700" fill="#1E2328">Semantic router</text>
  <text x="282" y="378" font-size="14" font-weight="600" fill="#5E4F85">auto</text>
  <text x="282" y="398" font-size="14" font-weight="600" fill="#5E4F85">(router enabled)</text>
  <rect x="282" y="420" width="184" height="62" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <text x="296" y="446" font-size="15" font-weight="700" fill="#24563A">classifier phone</text>
  <text x="296" y="468" font-size="13.5" fill="#2E6E46">picks 1 of 6 classes</text>
  <line x1="374" y1="482" x2="374" y2="510" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="282" y="512" width="184" height="62" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <text x="296" y="538" font-size="15" font-weight="700" fill="#24563A">class target</text>
  <text x="296" y="560" font-size="13.5" fill="#2E6E46">e.g. hard_coding</text>
  <text x="282" y="596" font-size="14" fill="#5B5F66">any failure → plain auto</text>
  <text x="282" y="636" font-size="13.5" font-weight="700" fill="#1E2328">best for</text>
  <text x="282" y="658" font-size="14" fill="#5B5F66">mixed traffic: each class</text>
  <text x="282" y="678" font-size="14" fill="#5B5F66">to the model that suits it</text>

  <!-- lane 3: pools -->
  <text x="508" y="352" font-size="17" font-weight="700" fill="#1E2328">Pools</text>
  <text x="508" y="378" font-size="14" font-weight="600" fill="#5E4F85">pool/&lt;name&gt;</text>
  <text x="508" y="398" font-size="14" font-weight="600" fill="#5E4F85">routing spread · affinity</text>
  <g font-size="13.5" font-weight="700" fill="#5B5F66" text-anchor="middle">
    <text x="540" y="434">req 1</text>
    <text x="600" y="434">req 2</text>
    <text x="660" y="434">req 3</text>
  </g>
  <g stroke="#5B5F66" stroke-width="2" marker-end="url(#arrow)">
    <line x1="540" y1="442" x2="540" y2="464"/>
    <line x1="600" y1="442" x2="600" y2="464"/>
    <line x1="660" y1="442" x2="660" y2="464"/>
  </g>
  <rect x="508" y="466" width="184" height="80" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <use href="#phone" x="526" y="477" width="28" height="48"/>
  <use href="#phone" x="586" y="477" width="28" height="48"/>
  <use href="#phone" x="646" y="477" width="28" height="48"/>
  <text x="600" y="538" font-size="13.5" fill="#2E6E46" text-anchor="middle">one phone per request</text>
  <text x="508" y="574" font-size="14" fill="#5B5F66">requests run in parallel</text>
  <text x="508" y="594" font-size="14" fill="#5B5F66">spread: fewest in-flight</text>
  <text x="508" y="636" font-size="13.5" font-weight="700" fill="#1E2328">best for</text>
  <text x="508" y="658" font-size="14" fill="#5B5F66">many independent</text>
  <text x="508" y="678" font-size="14" fill="#5B5F66">requests at once</text>

  <!-- lane 4: Super Borg -->
  <text x="734" y="352" font-size="17" font-weight="700" fill="#1E2328">Super Borg</text>
  <text x="734" y="378" font-size="14" font-weight="600" fill="#5E4F85">pool/&lt;name&gt;</text>
  <text x="734" y="398" font-size="14" font-weight="600" fill="#5E4F85">routing=superborg</text>
  <rect x="734" y="420" width="184" height="54" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <text x="826" y="443" font-size="15" font-weight="700" fill="#24563A" text-anchor="middle">orchestrator</text>
  <text x="826" y="463" font-size="13.5" fill="#2E6E46" text-anchor="middle">delegate tool</text>
  <g stroke="#5B5F66" stroke-width="2" marker-end="url(#arrow)">
    <line x1="790" y1="474" x2="770" y2="500"/>
    <line x1="826" y1="474" x2="826" y2="500"/>
    <line x1="862" y1="474" x2="882" y2="500"/>
  </g>
  <rect x="734" y="502" width="184" height="72" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <use href="#phone" x="756" y="510" width="28" height="48"/>
  <use href="#phone" x="812" y="510" width="28" height="48"/>
  <use href="#phone" x="868" y="510" width="28" height="48"/>
  <text x="734" y="596" font-size="14" fill="#5B5F66">workers, in parallel</text>
  <text x="734" y="636" font-size="13.5" font-weight="700" fill="#1E2328">best for</text>
  <text x="734" y="658" font-size="14" fill="#5B5F66">one request split into</text>
  <text x="734" y="678" font-size="14" fill="#5B5F66">parallel subtasks</text>

  <!-- lane 5: Big Brain -->
  <text x="960" y="352" font-size="17" font-weight="700" fill="#1E2328">Big Brain</text>
  <text x="960" y="378" font-size="14" font-weight="600" fill="#5E4F85">pool/&lt;name&gt;</text>
  <text x="960" y="398" font-size="14" font-weight="600" fill="#5E4F85">routing=bigbrain</text>
  <rect x="960" y="420" width="184" height="54" rx="12" fill="#DCE7F2" stroke="#2F5D8A" stroke-width="2"/>
  <text x="1052" y="443" font-size="15" font-weight="700" fill="#1F3F5E" text-anchor="middle">head on the host</text>
  <text x="1052" y="463" font-size="13.5" fill="#1F3F5E" text-anchor="middle">holds no weights</text>
  <line x1="1052" y1="474" x2="1052" y2="500" stroke="#5B5F66" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="960" y="502" width="184" height="72" rx="12" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <use href="#phone" x="972" y="516" width="26" height="44"/>
  <text x="1004" y="533" font-size="13.5" fill="#24563A">layers</text>
  <text x="1004" y="551" font-size="13.5" fill="#24563A">0–23</text>
  <use href="#phone" x="1056" y="516" width="26" height="44"/>
  <text x="1088" y="533" font-size="13.5" fill="#24563A">layers</text>
  <text x="1088" y="551" font-size="13.5" fill="#24563A">24–47</text>
  <text x="960" y="596" font-size="14" fill="#5B5F66">one request at a time</text>
  <text x="960" y="636" font-size="13.5" font-weight="700" fill="#1E2328">best for</text>
  <text x="960" y="658" font-size="14" fill="#5B5F66">a model too big for</text>
  <text x="960" y="678" font-size="14" fill="#5B5F66">any single phone</text>

  <!-- fleet -->
  <rect x="40" y="714" width="1120" height="92" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
  <text x="60" y="748" font-size="17" font-weight="700" fill="#24563A">The fleet</text>
  <text x="60" y="772" font-size="14" fill="#24563A">one model per phone;</text>
  <text x="60" y="792" font-size="14" fill="#24563A">modes use these phones</text>
  <g font-size="14" fill="#24563A">
    <use href="#phone" x="262" y="736" width="28" height="48"/><text x="300" y="766">Pixel 8 Pro</text>
    <use href="#phone" x="410" y="736" width="28" height="48"/><text x="448" y="766">OnePlus 10 Pro</text>
    <use href="#phone" x="584" y="736" width="28" height="48"/><text x="622" y="766">POCO F3</text>
    <use href="#phone" x="712" y="736" width="28" height="48"/><text x="750" y="766">Xiaomi Mi 8</text>
    <use href="#phone" x="862" y="736" width="28" height="48"/><text x="900" y="766">Xiaomi MI 9</text>
  </g>
  <text x="1140" y="788" font-size="13.5" fill="#2E6E46" text-anchor="end">Big Brain members run only RPC</text>

  <!-- legend -->
  <g font-size="13.5" fill="#5B5F66">
    <rect x="40" y="828" width="14" height="14" rx="3" fill="#7A6A9E"/><text x="62" y="840">clients · selectors</text>
    <rect x="200" y="828" width="14" height="14" rx="3" fill="#2F5D8A"/><text x="222" y="840">host processes</text>
    <rect x="340" y="828" width="14" height="14" rx="3" fill="#3C8D5A"/><text x="362" y="840">phones</text>
  </g>
</svg>
