<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5F66"/>
    </marker>
    <symbol id="phone" viewBox="0 0 28 48">
      <rect x="1.5" y="1.5" width="25" height="45" rx="5" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
      <rect x="5" y="7" width="18" height="30" rx="1.5" fill="#CFE7D7"/>
      <circle cx="14" cy="41.5" r="2" fill="#3C8D5A"/>
    </symbol>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="740" rx="24" fill="#FAFAF7"/>

  <!-- title -->
  <text x="40" y="58" font-size="26" font-weight="700" fill="#1E2328">PhoneBorg at a glance</text>
  <text x="40" y="84" font-size="15" fill="#5B5F66">One OpenAI-compatible endpoint in front of a drawer of phones</text>

  <!-- clients -->
  <rect x="40" y="150" width="200" height="190" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="60" y="182" font-size="17" font-weight="700" fill="#4A3F66">API clients</text>
  <text x="60" y="216" font-size="14" fill="#4A3F66">OpenAI SDK · curl</text>
  <text x="60" y="244" font-size="14" fill="#4A3F66">opencode · agents (MCP)</text>
  <text x="60" y="272" font-size="14" fill="#4A3F66">Ollama apps</text>
  <text x="60" y="306" font-size="12.5" fill="#7A6A9E">model: id · auto</text>
  <text x="60" y="324" font-size="12.5" fill="#7A6A9E">node/… · pool/…</text>

  <rect x="40" y="380" width="200" height="100" rx="14" fill="#ECE8F3" stroke="#7A6A9E" stroke-width="2"/>
  <text x="60" y="412" font-size="17" font-weight="700" fill="#4A3F66">Operators</text>
  <text x="60" y="440" font-size="14" fill="#4A3F66">pbctl · web browser</text>
  <text x="60" y="462" font-size="12.5" fill="#7A6A9E">admin token</text>

  <!-- host -->
  <rect x="290" y="110" width="500" height="560" rx="18" fill="#EEF3F8" stroke="#2F5D8A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="310" y="137" font-size="14" font-weight="600" fill="#2F5D8A">HOST · Linux or macOS, runs adb</text>

  <!-- controller -->
  <rect x="315" y="150" width="460" height="280" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2.5"/>
  <text x="332" y="180" font-size="18" font-weight="700" fill="#1F3F5E">controller</text>
  <text x="430" y="180" font-size="13" fill="#5B5F66">one Go process</text>

  <g font-size="13" fill="#1F3F5E">
    <rect x="332" y="196" width="135" height="94" rx="10" fill="#DCE7F2"/>
    <text x="346" y="224" font-size="16" font-weight="700">gateway</text>
    <text x="346" y="250">auth · picker</text>
    <text x="346" y="270">failover</text>

    <rect x="477" y="196" width="135" height="94" rx="10" fill="#DCE7F2"/>
    <text x="491" y="224" font-size="16" font-weight="700">registry</text>
    <text x="491" y="250">nodes · states</text>
    <text x="491" y="270">heartbeats</text>

    <rect x="622" y="196" width="135" height="94" rx="10" fill="#DCE7F2"/>
    <text x="636" y="224" font-size="16" font-weight="700">catalog</text>
    <text x="636" y="250">models</text>
    <text x="636" y="270">placement plan</text>

    <rect x="332" y="310" width="135" height="100" rx="10" fill="#DCE7F2"/>
    <text x="346" y="338" font-size="16" font-weight="700">admin + panel</text>
    <text x="346" y="364">/admin · /ui</text>
    <text x="346" y="384">pools · jobs</text>

    <rect x="477" y="310" width="135" height="100" rx="10" fill="#DCE7F2"/>
    <text x="491" y="338" font-size="16" font-weight="700">Big Brain head</text>
    <text x="491" y="364">llama-server --rpc</text>
    <text x="491" y="384">:18200+</text>

    <rect x="622" y="310" width="135" height="100" rx="10" fill="#DCE7F2"/>
    <text x="636" y="338" font-size="16" font-weight="700">/metrics</text>
    <text x="636" y="364">Prometheus</text>
    <text x="636" y="384">exposition</text>
  </g>

  <!-- pcprov + adb -->
  <rect x="315" y="455" width="225" height="85" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text x="332" y="485" font-size="16" font-weight="700" fill="#1F3F5E">pcprov</text>
  <text x="332" y="508" font-size="13" fill="#1F3F5E">USB hot-plug watch</text>
  <text x="332" y="527" font-size="13" fill="#1F3F5E">provisions phones over adb</text>

  <rect x="315" y="565" width="225" height="80" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text x="332" y="595" font-size="16" font-weight="700" fill="#1F3F5E">adb server</text>
  <text x="332" y="618" font-size="13" fill="#1F3F5E">:5037 · reverse / forward</text>
  <text x="332" y="636" font-size="13" fill="#1F3F5E">tunnels over USB</text>
  <line x1="427" y1="540" x2="427" y2="562" stroke="#5B5F66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- monitoring -->
  <rect x="575" y="455" width="200" height="85" rx="12" fill="#F6EBDD" stroke="#C27C2C" stroke-width="2"/>
  <text x="592" y="485" font-size="16" font-weight="700" fill="#7A4B14">Prometheus</text>
  <text x="592" y="508" font-size="13" fill="#7A4B14">:9090</text>
  <text x="592" y="527" font-size="13" fill="#7A4B14">scrapes every 5 s</text>

  <rect x="575" y="565" width="200" height="80" rx="12" fill="#F6EBDD" stroke="#C27C2C" stroke-width="2"/>
  <text x="592" y="595" font-size="16" font-weight="700" fill="#7A4B14">Grafana</text>
  <text x="592" y="618" font-size="13" fill="#7A4B14">:3000 · 3 dashboards</text>
  <text x="592" y="636" font-size="13" fill="#7A4B14">also in the panel /grafana/</text>

  <line x1="689" y1="410" x2="689" y2="452" stroke="#C27C2C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="675" y1="540" x2="675" y2="562" stroke="#C27C2C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- client arrows -->
  <line x1="240" y1="243" x2="329" y2="243" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="265" y="232" font-size="12" font-weight="600" fill="#5B5F66" text-anchor="middle">:18080</text>
  <text x="265" y="262" font-size="12" fill="#5B5F66" text-anchor="middle">:11434</text>
  <path d="M240,430 H300 V360 H329" fill="none" stroke="#5B5F66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- USB bus -->
  <line x1="945" y1="175" x2="945" y2="560" stroke="#3C8D5A" stroke-width="4" stroke-linecap="round"/>
  <text x="945" y="160" font-size="13" font-weight="700" fill="#3C8D5A" text-anchor="middle">USB</text>
  <line x1="945" y1="210" x2="973" y2="210" stroke="#3C8D5A" stroke-width="4"/>
  <line x1="945" y1="360" x2="973" y2="360" stroke="#3C8D5A" stroke-width="4"/>
  <line x1="945" y1="530" x2="973" y2="530" stroke="#3C8D5A" stroke-width="4"/>

  <!-- controller <-> phones -->
  <line x1="775" y1="243" x2="941" y2="243" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="805" y="232" font-size="13" font-weight="700" fill="#1E2328">requests</text>
  <text x="805" y="264" font-size="12" fill="#5B5F66">adb forward</text>
  <text x="805" y="280" font-size="12" fill="#5B5F66">→ phone :18090</text>

  <line x1="941" y1="372" x2="778" y2="372" stroke="#5B5F66" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="805" y="361" font-size="13" font-weight="700" fill="#1E2328">register · heartbeat</text>
  <text x="805" y="393" font-size="12" fill="#5B5F66">model files</text>
  <text x="805" y="409" font-size="12" fill="#5B5F66">adb reverse :18080</text>

  <path d="M540,605 H560 V658 H945 V564" fill="none" stroke="#3C8D5A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="835" y="650" font-size="12" fill="#3C8D5A">adb over USB</text>

  <!-- phones -->
  <g font-size="13" fill="#24563A">
    <rect x="975" y="150" width="200" height="120" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="991" y="166" width="28" height="48"/>
    <text x="1031" y="182" font-size="16" font-weight="700">phone 1</text>
    <text x="1031" y="206">node-agent</text>
    <text x="1031" y="226">llama-server</text>
    <text x="991" y="254" font-size="12" fill="#3C8D5A">:18090 on the phone</text>

    <rect x="975" y="300" width="200" height="120" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="991" y="316" width="28" height="48"/>
    <text x="1031" y="332" font-size="16" font-weight="700">phone 2</text>
    <text x="1031" y="356">node-agent</text>
    <text x="1031" y="376">llama-server</text>
    <text x="991" y="404" font-size="12" fill="#3C8D5A">or ggml-rpc-server</text>

    <text x="1075" y="448" font-size="22" font-weight="700" fill="#3C8D5A" text-anchor="middle">⋮</text>

    <rect x="975" y="470" width="200" height="120" rx="14" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="2"/>
    <use href="#phone" x="991" y="486" width="28" height="48"/>
    <text x="1031" y="502" font-size="16" font-weight="700">phone N</text>
    <text x="1031" y="526">node-agent</text>
    <text x="1031" y="546">llama-server</text>
    <text x="991" y="574" font-size="12" fill="#3C8D5A">benchmarks itself</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#5B5F66">
    <rect x="40" y="698" width="14" height="14" rx="3" fill="#7A6A9E"/><text x="62" y="710">clients</text>
    <rect x="130" y="698" width="14" height="14" rx="3" fill="#2F5D8A"/><text x="152" y="710">host processes</text>
    <rect x="270" y="698" width="14" height="14" rx="3" fill="#3C8D5A"/><text x="292" y="710">phones</text>
    <rect x="352" y="698" width="14" height="14" rx="3" fill="#C27C2C"/><text x="374" y="710">monitoring (optional)</text>
  </g>
</svg>
