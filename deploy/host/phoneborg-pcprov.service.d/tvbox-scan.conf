# Network-adb discovery of Android TV boxes (ADR-035, docs/TVBOXES.md#network-discovery).
# Optional, not installed by install.sh. The subnet is the reference
# cluster's TV box network; change -scan to yours. Install:
#   sudo mkdir -p /etc/systemd/system/phoneborg-pcprov.service.d
#   sudo cp deploy/host/phoneborg-pcprov.service.d/tvbox-scan.conf /etc/systemd/system/phoneborg-pcprov.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart phoneborg-pcprov
[Service]
ExecStart=
ExecStart=/srv/phoneborg/app/bin/pcprov watch -model /srv/phoneborg/state/models/qwen2.5-0.5b-instruct-q4_k_m.gguf -agent-args "-ctx-size 16384" -admin-token-file /srv/phoneborg/admin-token -scan 192.168.44.0/22
