# Big Brain heads (ADR-034, ADR-036, ADR-037) and the reference cluster's
# trusted subnets. Optional, not installed by install.sh. Build the heads
# first (make llama-head, and make prima-head for backend=prima), copy
# bin/llama-head and bin/prima-head to /srv/phoneborg/app/bin/, and change
# -trusted-cidrs to your networks. Install:
#   sudo mkdir -p /etc/systemd/system/phoneborg-controller.service.d
#   sudo cp deploy/host/phoneborg-controller.service.d/bigbrain.conf /etc/systemd/system/phoneborg-controller.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart phoneborg-controller
[Service]
ExecStart=
ExecStart=/srv/phoneborg/app/bin/controller -listen :18080 -ollama-listen :11434 -upstream-timeout 600s -admin-token-file /srv/phoneborg/admin-token -state-dir /srv/phoneborg/state -firmware-check -grafana-url http://127.0.0.1:3000 -gateway-access local -bigbrain-head /srv/phoneborg/app/bin/llama-head/llama-server -bigbrain-prima-head /srv/phoneborg/app/bin/prima-head/llama-server -trusted-cidrs 127.0.0.0/8,::1/128,10.10.100.0/24,192.168.8.0/24
