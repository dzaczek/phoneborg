# systemd drop-in: Grafana served by the controller under /grafana/ (ADR-031).
# Install: sudo mkdir -p /etc/systemd/system/grafana-server.service.d
#          sed "s/__HOST__/<controller-ip>/" deploy/host/grafana-phoneborg.conf | sudo tee /etc/systemd/system/grafana-server.service.d/phoneborg.conf
[Service]
Environment=GF_SERVER_ROOT_URL=http://__HOST__:18080/grafana/
Environment=GF_SERVER_SERVE_FROM_SUB_PATH=true
Environment=GF_SECURITY_ALLOW_EMBEDDING=true
# Read-only dashboards in the panel without a second login.
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/srv/phoneborg/app/deploy/grafana/dashboards/phoneborg.json
