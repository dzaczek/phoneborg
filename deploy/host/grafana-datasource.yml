# Install: sudo cp deploy/host/grafana-datasource.yml /etc/grafana/provisioning/datasources/phoneborg.yml
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
